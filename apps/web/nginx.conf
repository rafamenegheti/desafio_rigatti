server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;

  # /api/products -> http://api:3333/products (mesma origem para o navegador)
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Sem buffer, para o streaming (SSE) do chat chegar token a token
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Rotas do React Router: qualquer caminho desconhecido devolve o index.html
  location / {
    try_files $uri /index.html;
  }
}
